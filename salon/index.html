<style>
/* ==================================================================== tokens
   Emerald and brass on ivory. The green is carried by the plants and the
   dark stones in the photographs; brass picks up the oils and the gold lid.
   Committed light design — no dark variant. */
:root{
  color-scheme: light;

  --paper:    #F6F4EF;
  --card:     #FFFFFF;
  --sand:     #E9EFE8;   /* pale sage panels */
  --sand-2:   #D5E2D5;
  --ink:      #14211B;   /* deep pine, not black */
  --ink-2:    #52625A;
  --ink-3:    #8B9890;

  --brand:    #0F6B4F;   /* emerald — every primary fill */
  --brand-d:  #0A4D39;
  --brand-lt: #E3EEE8;

  --amber:    #B08A3C;   /* brass — highlights only */
  --amber-d:  #8A6A24;
  --amber-lt: #D9B978;

  --line:     #E2E7DF;
  --line-2:   #CCD7CB;

  --r:   20px;
  --r-s: 12px;
  --r-l: 30px;
  --r-p: 999px;

  --sh-s: 0 1px 2px rgba(16,34,26,.05), 0 6px 16px -10px rgba(16,34,26,.18);
  --sh:   0 2px 4px rgba(16,34,26,.04), 0 18px 40px -18px rgba(16,34,26,.24);
  --sh-l: 0 4px 8px rgba(16,34,26,.04), 0 40px 80px -30px rgba(16,34,26,.30);

  --f-d: "Bodoni Moda", "Didot", "Hoefler Text", Georgia, serif;
  --f-b: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  --rail: 264px;
  --gut: clamp(20px, 4vw, 56px);
  --e: cubic-bezier(.22,.68,.3,1);
}

*{ box-sizing: border-box; }

body{
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-b);
  font-size: clamp(.95rem, .35vw + .87rem, 1.02rem);
  font-weight: 400;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection{ background: var(--sand-2); color: var(--ink); }

h1,h2,h3,h4{
  font-family: var(--f-d);
  font-weight: 400;
  font-optical-sizing: auto;
  line-height: 1.05;
  letter-spacing: -.018em;
  margin: 0;
  text-wrap: balance;
}
h1{ font-size: clamp(2.5rem, 5.6vw, 4.4rem); }
h2{ font-size: clamp(1.9rem, 3.6vw, 3rem); }
h3{ font-size: clamp(1.12rem, 1.5vw, 1.35rem); letter-spacing: -.01em; }
h4{ font-size: .8rem; }
p{ margin: 0; }
a{ color: inherit; text-decoration: none; }
img{ display: block; }
button{ font: inherit; color: inherit; }

:focus-visible{ outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }

.sr{
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

.lede{ color: var(--ink-2); font-size: clamp(1rem, .5vw + .9rem, 1.12rem); max-width: 60ch; }
.note{ color: var(--ink-2); font-size: .9rem; }
.err{ color: #C0392B; font-size: .9rem; font-weight: 500; }
.lnk{ background: none; border: 0; padding: 0; color: var(--brand); text-decoration: underline; cursor: pointer; }

.eyebrow{
  display: flex; align-items: center; gap: 10px;
  font-size: .69rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--brand); margin-bottom: 14px;
}
.eyebrow span{ width: 26px; height: 2px; border-radius: 2px; background: var(--amber); flex: none; }

.stars{ display: inline-flex; gap: 2px; color: var(--amber); }
.stars svg{ width: 14px; height: 14px; }

/* ==================================================================== buttons */
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border-radius: var(--r-p); cursor: pointer;
  font-family: var(--f-b); font-size: .85rem; font-weight: 600; letter-spacing: .005em;
  border: 1px solid transparent; white-space: nowrap;
  transition: transform .28s var(--e), background .28s var(--e), color .28s var(--e), border-color .28s var(--e), box-shadow .28s var(--e);
  -webkit-tap-highlight-color: transparent;
}
.btn svg{ width: 16px; height: 16px; flex: none; }
.btn--solid{ background: var(--brand); color: #fff; box-shadow: var(--sh-s); }
.btn--solid:hover{ background: var(--brand-d); transform: translateY(-2px); }
.btn--line{ background: var(--card); color: var(--ink); border-color: var(--line-2); }
.btn--line:hover{ border-color: var(--brand); color: var(--brand); transform: translateY(-2px); }
.btn--ghost{ background: transparent; color: var(--ink-2); }
.btn--ghost:hover{ color: var(--ink); background: var(--sand); }
.btn[disabled]{ opacity: .4; cursor: not-allowed; transform: none; }

/* ==================================================================== shell */
.app{ min-height: 100vh; }

.rail{
  position: fixed; inset: 0 auto 0 0; width: var(--rail); z-index: 40;
  background: var(--card); border-right: 1px solid var(--line);
  padding: 30px 22px; display: flex; flex-direction: column; gap: 26px;
}
.brand{ display: flex; flex-direction: column; gap: 1px; }
.brand__m{
  font-family: var(--f-d); font-size: 1.9rem; font-weight: 600;
  letter-spacing: .1em; line-height: 1;
}
.brand__s{ font-size: .64rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--brand); }

.rail__nav{ display: flex; flex-direction: column; gap: 3px; }
.rail__l{
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--r-s); color: var(--ink-2);
  font-size: .92rem; font-weight: 500;
  transition: background .25s var(--e), color .25s var(--e);
}
.rail__l svg{ width: 18px; height: 18px; opacity: .7; }
.rail__l:hover{ background: var(--sand); color: var(--ink); }
.rail__l.is-on{ background: var(--brand); color: #fff; }
.rail__l.is-on svg{ opacity: 1; }

.rail__foot{ margin-top: auto; display: grid; gap: 12px; }
.rail__card{ background: var(--brand-lt); border-radius: var(--r); padding: 16px 18px; }
.rail__k{ font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
.rail__v{ font-family: var(--f-d); font-size: 1.3rem; margin-top: 2px; }
.rail__p{ display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: .82rem; font-weight: 600; color: var(--ink); }
.rail__p svg{ width: 14px; height: 14px; color: var(--brand); }
.rail__addr{ font-size: .76rem; color: var(--ink-3); line-height: 1.5; }

.topbar{ display: none; }
.tabbar{ display: none; }

.main{ margin-left: var(--rail); padding: 0 var(--gut) 0; }
.page{ max-width: 1120px; margin-inline: auto; padding-block: clamp(32px, 4vw, 56px) 0; overflow-x: clip; animation: pageIn .5s var(--e) both; }
@keyframes pageIn{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: 1; transform: none; } }

@media (max-width: 1000px){
  .rail{ display: none; }
  .main{ margin-left: 0; padding-bottom: 84px; }
  .topbar{
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 40;
    padding: 12px var(--gut);
    background: rgba(246,244,239,.92); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  }
  .topbar .brand{ margin-right: auto; }
  .topbar .brand__m{ font-size: 1.5rem; }
  .topbar__call{
    width: 42px; height: 42px; border-radius: var(--r-p); display: grid; place-items: center;
    border: 1px solid var(--line-2); color: var(--ink);
  }
  .topbar__call svg{ width: 17px; height: 17px; }
  .topbar .btn{ padding: 11px 18px; }
  .tabbar{
    display: flex; position: fixed; inset: auto 0 0 0; z-index: 45;
    background: rgba(255,255,255,.94); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .tabbar__l{
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 2px; border-radius: var(--r-s); color: var(--ink-3); font-size: .64rem; font-weight: 600;
  }
  .tabbar__l svg{ width: 19px; height: 19px; }
  .tabbar__l.is-on{ color: var(--brand); background: var(--brand-lt); }
}

/* ==================================================================== reveal */
.rv{ opacity: 0; transform: translateY(16px); }
.rv.in{ opacity: 1; transform: none; transition: opacity .7s var(--e), transform .7s var(--e); }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .rv{ opacity: 1; transform: none; }
}

/* ==================================================================== hero */
.hero{ padding-block: 0 clamp(18px, 2.4vw, 30px); }
.hero__media{
  position: relative; border-radius: var(--r-l); overflow: hidden; isolation: isolate;
  aspect-ratio: 16 / 9.6; box-shadow: var(--sh-l); background: var(--sand);
}
.hero__media img{
  width: 100%; height: 100%; object-fit: cover; object-position: 58% 42%;
  animation: kenburns 26s ease-in-out infinite alternate;
}
@keyframes kenburns{ from{ transform: scale(1); } to{ transform: scale(1.07); } }
.hero__scrim{
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, rgba(10,22,17,.92) 1%, rgba(10,22,17,.78) 26%,
              rgba(10,22,17,.56) 46%, rgba(10,22,17,.10) 74%, rgba(10,22,17,.28) 100%);
}
.hero__text{
  position: absolute; inset: auto 0 0 0; padding: clamp(22px, 4vw, 54px); color: #fff;
  text-shadow: 0 1px 30px rgba(8,18,13,.55);
}
.hero__text .eyebrow{ color: #EFCC91; }
.hero__text .eyebrow span{ background: var(--amber-lt); }
.hero h1{ color: #fff; font-size: clamp(2.5rem, 6.4vw, 5.2rem); line-height: .98; }
.hero h1 em{ display: block; font-style: italic; color: #F2DCB4; }
.hero__sub{ color: #E5DCD1; max-width: 46ch; margin-top: 14px; font-size: clamp(.95rem, .5vw + .85rem, 1.08rem); }
.hero__cta{ display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(18px, 2.4vw, 28px); }
.hero .btn--solid{ background: #fff; color: var(--ink); }
.hero .btn--solid:hover{ background: var(--amber-lt); color: var(--ink); }
.hero .btn--line{
  background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.36);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.hero .btn--line:hover{ background: rgba(255,255,255,.24); color: #fff; border-color: #fff; }

.hero__chip{
  position: absolute; z-index: 2; display: flex; align-items: center; gap: 10px;
  top: clamp(14px, 2.6vw, 26px); right: clamp(14px, 2.6vw, 26px);
  background: rgba(255,255,255,.93); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--r-p); padding: 9px 16px 9px 12px; box-shadow: var(--sh);
}
.hero__chip svg{ width: 17px; height: 17px; color: var(--amber-d); flex: none; }
.hero__chip .stars{ display: inline-flex; flex-direction: row; color: var(--amber); }
.hero__chip > span{ display: flex; flex-direction: column; line-height: 1.26; font-size: .68rem; color: var(--ink-3); }
.hero__chip b{ font-size: .8rem; font-weight: 700; color: var(--ink); }

.hero__facts{
  list-style: none; margin: clamp(12px, 1.6vw, 18px) 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
}
.hero__facts li{ background: var(--card); padding: 16px 18px 18px; display: flex; flex-direction: column; }
.hero__facts b{
  font-family: var(--f-d); font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 500;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.hero__facts span{ font-size: .72rem; color: var(--ink-3); font-weight: 500; margin-top: 5px; }

@media (max-width: 860px){
  .hero__media{ aspect-ratio: 4 / 5; }
  .hero__media img{ object-position: 62% 38%; }
  .hero__facts{ grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 460px){
  .hero__chip{ display: none; }
  .hero__cta .btn{ flex: 1 1 100%; }
}

/* ==================================================================== strip */
.strip{
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px;
  scrollbar-width: none;
}
.strip::-webkit-scrollbar{ display: none; }
.strip__i{
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--r-p);
  background: var(--card); border: 1px solid var(--line);
  font-size: .82rem; font-weight: 600; color: var(--ink-2);
  transition: all .25s var(--e);
}
.strip__i svg{ width: 14px; height: 14px; color: var(--brand); }
.strip__i:hover{ border-color: var(--brand); color: var(--brand); transform: translateY(-2px); }

/* ==================================================================== sections */
.sec{ padding-block: clamp(44px, 6vw, 84px); }
.sec--tint{
  background: var(--sand); border-radius: var(--r-l);
  padding-inline: clamp(20px, 3.4vw, 48px); margin-block: clamp(20px, 3vw, 36px);
}
.sec__h{
  display: flex; flex-wrap: wrap; gap: 16px 40px;
  align-items: flex-end; justify-content: space-between; margin-bottom: 30px;
}
.sec__note{ color: var(--ink-2); font-size: .95rem; max-width: 38ch; }

.phead{ padding-block: clamp(10px, 2vw, 22px) clamp(26px, 3vw, 38px); }
.phead h1{ margin-bottom: 16px; }

/* ==================================================================== feature cards */
.feat{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.feat__c a{
  display: flex; flex-direction: column; height: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; transition: transform .4s var(--e), box-shadow .4s var(--e), border-color .4s var(--e);
}
.feat__c a:hover{ transform: translateY(-5px); box-shadow: var(--sh); border-color: var(--line-2); }
.feat__img{ display: block; overflow: hidden; aspect-ratio: 4/3; }
.feat__c--tall{ grid-row: span 2; }
.feat__c--tall .feat__img{ aspect-ratio: 3/4; }
.feat__img img{ width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--e); }
.feat__c a:hover .feat__img img{ transform: scale(1.05); }
.feat__b{ display: block; padding: 20px 20px 22px; }
.feat__b p{ color: var(--ink-2); font-size: .9rem; margin-top: 7px; }
.feat__go{
  display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
  font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--brand);
}
.feat__go svg{ width: 14px; height: 14px; transition: transform .3s var(--e); }
.feat__c a:hover .feat__go svg{ transform: translateX(4px); }
@media (max-width: 900px){ .feat{ grid-template-columns: repeat(2, 1fr); } .feat__c--tall{ grid-row: span 1; } .feat__c--tall .feat__img{ aspect-ratio: 4/3; } }
@media (max-width: 560px){ .feat{ grid-template-columns: 1fr; } }

/* ==================================================================== popular */
.pop{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pop__c a{
  display: flex; flex-direction: column; height: 100%; gap: 6px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 20px; transition: transform .35s var(--e), box-shadow .35s var(--e);
}
.pop__c a:hover{ transform: translateY(-4px); box-shadow: var(--sh); }
.pop__cat{ font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
.pop__c p{ color: var(--ink-2); font-size: .86rem; }
.pop__f{ display: flex; align-items: baseline; gap: 8px; margin-top: auto; padding-top: 14px; }
.pop__f b{ font-family: var(--f-d); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.pop__f em{ font-style: normal; font-size: .74rem; color: var(--ink-3); }
@media (max-width: 900px){ .pop{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px){ .pop{ grid-template-columns: 1fr; } }

/* ==================================================================== dark band */
.band{
  position: relative; border-radius: var(--r-l); overflow: hidden;
  min-height: 380px; display: flex; align-items: center; isolation: isolate;
}
.band__bg{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.band::after{
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(100deg, rgba(18,14,15,.94) 6%, rgba(18,14,15,.78) 42%, rgba(18,14,15,.18) 78%);
}
.band__in{ padding: clamp(28px, 4vw, 52px); max-width: 620px; color: #FBF4F2; }
.band__in .eyebrow{ color: #F4A9BC; }
.band__in .eyebrow span{ background: var(--amber); }
.band__in h2{ color: #fff; margin-bottom: 14px; }
.band__in p{ color: #D9C9CC; font-size: .96rem; margin-bottom: 22px; max-width: 48ch; }
.band__in .btn--ghost{ color: #fff; border-color: rgba(255,255,255,.3); }
.band__in .btn--ghost:hover{ background: rgba(255,255,255,.12); color: #fff; }

/* ==================================================================== reviews */
.rev{ display: grid; gap: 20px; justify-items: center; }
.rev__q{ max-width: 68ch; text-align: center; display: grid; gap: 16px; justify-items: center; }
.rev__q blockquote{
  margin: 0; font-family: var(--f-d); font-size: clamp(1.25rem, 2.3vw, 1.8rem);
  line-height: 1.36;
  animation: fadeUp .6s var(--e) both;
}
@keyframes fadeUp{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: none; } }
.rev__q footer{ display: flex; align-items: center; gap: 11px; }
.rev__av{
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand-lt); border: 1px solid var(--line-2); color: var(--brand-d);
  font-family: var(--f-d); font-size: 1.05rem;
}
.rev__q footer b{ display: block; font-size: .9rem; font-weight: 700; text-align: left; }
.rev__q footer em{ font-style: normal; font-size: .78rem; color: var(--ink-3); }
.rev__dots{ display: flex; gap: 7px; }
.dot{ width: 7px; height: 7px; border-radius: 50%; border: 0; background: var(--line-2); cursor: pointer; padding: 0; transition: all .3s var(--e); }
.dot.is-on{ background: var(--brand); width: 22px; border-radius: var(--r-p); }

/* ==================================================================== cta */
.cta{
  display: flex; flex-wrap: wrap; gap: 22px 40px; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #0C5540 0%, #0F6B4F 46%, #14805E 100%);
  color: #fff; border-radius: var(--r-l);
  padding: clamp(28px, 4vw, 48px); margin-block: clamp(28px, 4vw, 52px);
}
.cta h2{ color: #fff; }
.cta p{ color: #CFE3D8; margin-top: 10px; font-size: .95rem; max-width: 44ch; }
.cta__b{ display: flex; flex-wrap: wrap; gap: 10px; }
.cta .btn--solid{ background: var(--amber-lt); color: #14211B; }
.cta .btn--solid:hover{ background: #fff; color: var(--brand-d); }
.cta .btn--line{ background: transparent; color: #fff; border-color: rgba(255,255,255,.28); }
.cta .btn--line:hover{ background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.5); }

/* ==================================================================== filters */
.filters{ display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 26px; }
.pills{ display: flex; flex-wrap: wrap; gap: 7px; }
.pills--wide{ margin-bottom: 24px; }
.pill{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: var(--r-p); cursor: pointer;
  background: var(--card); border: 1px solid var(--line); color: var(--ink-2);
  font-size: .82rem; font-weight: 600;
  transition: all .25s var(--e);
}
.pill:hover{ border-color: var(--brand); color: var(--brand); }
.pill.is-on{ background: var(--brand); border-color: var(--brand); color: #fff; }
.pill__n{ font-size: .68rem; opacity: .6; font-variant-numeric: tabular-nums; }
.search input{
  width: min(280px, 62vw); padding: 11px 16px; border-radius: var(--r-p);
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink);
  font-family: var(--f-b); font-size: .88rem;
}
.search input::placeholder{ color: var(--ink-3); }
.search input:focus{ outline: none; border-color: var(--brand); }
.empty{ color: var(--ink-2); padding: 30px 0; }

/* ==================================================================== service groups */
.grp{ padding-block: 12px 34px; }
.grp__h{ display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.grp__img{ width: 54px; height: 54px; border-radius: var(--r-s); overflow: hidden; flex: none; }
.photo{ display: block; overflow: hidden; }
.photo img{ width: 100%; height: 100%; object-fit: cover; }
.grp__h h2{ font-size: clamp(1.5rem, 2.4vw, 2rem); }
.grp__h p{ font-size: .78rem; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

.cards{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 720px){ .cards{ grid-template-columns: 1fr; } }
.card{
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 20px; display: flex; flex-direction: column; gap: 8px;
  transition: border-color .3s var(--e), box-shadow .3s var(--e), transform .3s var(--e);
}
.card:hover{ border-color: var(--line-2); box-shadow: var(--sh-s); transform: translateY(-2px); }
.card__t{ display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.badge{
  flex: none; font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  background: #F3E9D3; color: var(--amber-d); padding: 4px 9px; border-radius: var(--r-p);
}
.card__d{ color: var(--ink-2); font-size: .88rem; }
.card__f{ display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 10px; }
.card__p{ font-family: var(--f-d); font-size: 1.3rem; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; line-height: 1.15; }
.card__p em{ font-family: var(--f-b); font-style: normal; font-size: .72rem; color: var(--ink-3); font-weight: 500; }
.card__b{
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
  border-radius: var(--r-p); border: 1px solid var(--line-2);
  font-size: .78rem; font-weight: 600; transition: all .25s var(--e);
}
.card__b svg{ width: 13px; height: 13px; }
.card__b:hover{ background: var(--brand); color: #fff; border-color: var(--brand); }

/* ==================================================================== bundles */
.bundles{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px){ .bundles{ grid-template-columns: 1fr; } }
.bundle{
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 26px 24px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;
}
.bundle--star{ border-color: var(--brand); background: linear-gradient(180deg, var(--brand-lt), var(--card) 46%); }
.bundle__f{
  position: absolute; top: 0; right: 0; background: var(--amber); color: #fff;
  font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 5px 12px;
  border-bottom-left-radius: var(--r-s);
}
.bundle__p{ font-family: var(--f-d); font-size: 2.1rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.bundle__p em{ display: block; font-family: var(--f-b); font-style: normal; font-size: .72rem; color: var(--ink-3); font-weight: 600; margin-top: 6px; letter-spacing: .04em; }
.bundle ul{ list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 9px; }
.bundle li{ display: grid; grid-template-columns: 16px 1fr; gap: 9px; font-size: .88rem; color: var(--ink-2); align-items: start; }
.bundle li svg{ width: 14px; height: 14px; color: var(--brand); margin-top: 5px; }
.bundle .btn{ margin-top: auto; }

/* ==================================================================== masonry */
.masonry{ columns: 3; column-gap: 14px; }
@media (max-width: 900px){ .masonry{ columns: 2; } }
@media (max-width: 520px){ .masonry{ columns: 1; } }
.masonry__i{ break-inside: avoid; margin-bottom: 14px; }
.masonry__i button{
  display: block; width: 100%; padding: 0; border: 1px solid var(--line); cursor: pointer;
  background: var(--card); border-radius: var(--r); overflow: hidden; position: relative;
  transition: transform .4s var(--e), box-shadow .4s var(--e);
}
.masonry__i button:hover{ transform: translateY(-4px); box-shadow: var(--sh); }
.masonry__i img{ width: 100%; height: auto; transition: transform .7s var(--e); }
.masonry__i button:hover img{ transform: scale(1.04); }
.masonry__c{
  position: absolute; inset: auto 0 0 0; padding: 28px 14px 12px; text-align: left;
  background: linear-gradient(to top, rgba(20,14,16,.82), transparent);
  color: #fff; font-size: .78rem; font-weight: 600;
}

/* ==================================================================== lightbox */
.lb{
  position: fixed; inset: 0; z-index: 90; background: rgba(24,17,19,.9);
  display: grid; place-items: center; padding: 20px;
  animation: fade .25s var(--e) both;
}
@keyframes fade{ from{ opacity: 0 } to{ opacity: 1 } }
.lb figure{ margin: 0; max-width: min(880px, 92vw); }
.lb img{ width: 100%; height: auto; max-height: 76vh; object-fit: contain; border-radius: var(--r); background: #100C0D; }
.lb figcaption{
  display: flex; justify-content: space-between; gap: 16px; align-items: baseline;
  color: #F3E9EA; font-size: .86rem; font-weight: 600; padding-top: 12px;
}
.lb figcaption span{ color: #A8969A; font-variant-numeric: tabular-nums; font-size: .78rem; }
.lb__x, .lb__n{
  position: absolute; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
  color: #fff; border-radius: 50%; width: 44px; height: 44px; display: grid; place-items: center;
  cursor: pointer; transition: background .25s var(--e);
}
.lb__x:hover, .lb__n:hover{ background: rgba(255,255,255,.22); }
.lb__x svg, .lb__n svg{ width: 18px; height: 18px; }
.lb__x{ top: 18px; right: 18px; }
.lb__n--l{ left: 14px; top: 50%; transform: translateY(-50%); }
.lb__n--r{ right: 14px; top: 50%; transform: translateY(-50%); }
@media (max-width: 620px){
  .lb__n--l{ left: 8px; } .lb__n--r{ right: 8px; }
  .lb__n{ width: 38px; height: 38px; }
}

/* ==================================================================== split / studio */
.split{ display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(24px, 4vw, 56px); align-items: center; padding-block: clamp(20px, 3vw, 40px); }
@media (max-width: 860px){ .split{ grid-template-columns: 1fr; } }
.split__art{ position: relative; }
.split__art img{ width: 100%; height: auto; border-radius: var(--r-l); box-shadow: var(--sh); }
.split__stamp{
  position: absolute; right: -14px; bottom: 26px;
  background: var(--brand); color: #fff; border-radius: var(--r);
  padding: 14px 18px; text-align: center; box-shadow: var(--sh);
}
.split__stamp b{ display: block; font-family: var(--f-d); font-size: 1.6rem; line-height: 1; }
.split__stamp span{ font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .86; }
.split__copy h2{ margin-bottom: 16px; }
.split__copy p{ color: var(--ink-2); max-width: 58ch; }
.ticks{ list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 14px; }
.ticks li{ display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; font-size: .92rem; color: var(--ink-2); }
.ticks svg{ width: 18px; height: 18px; color: var(--brand); margin-top: 4px; }
.ticks b{ color: var(--ink); font-weight: 700; }

/* ==================================================================== team */
.team{ display: grid; gap: 12px; }
.tm{
  display: grid; grid-template-columns: 64px 1fr auto; gap: 18px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px;
  transition: border-color .3s var(--e), box-shadow .3s var(--e);
}
.tm:hover{ border-color: var(--line-2); box-shadow: var(--sh-s); }
.tm__av{
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(140deg, #CFE3D6, #EFE3C7);
  color: var(--brand-d); font-family: var(--f-d); font-size: 1.3rem; font-weight: 600; letter-spacing: .02em;
  border: 1px solid var(--line-2);
}
.tm__r{ font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--brand); margin-top: 2px; }
.tm__n{ color: var(--ink-2); font-size: .89rem; margin-top: 8px; max-width: 62ch; }
.tm__s{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
.tm__s span{ font-size: .68rem; font-weight: 600; color: var(--ink-2); background: var(--sand); border-radius: var(--r-p); padding: 4px 10px; }
.tm__go{ display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--brand); white-space: nowrap; }
.tm__go svg{ width: 14px; height: 14px; transition: transform .3s var(--e); }
.tm:hover .tm__go svg{ transform: translateX(4px); }
@media (max-width: 760px){
  .tm{ grid-template-columns: 52px 1fr; gap: 14px; }
  .tm__av{ width: 52px; height: 52px; font-size: 1.1rem; }
  .tm__go{ grid-column: 2; }
}

/* ==================================================================== faq */
.faq{ display: grid; gap: 8px; }
.qa{ background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.qa summary{
  list-style: none; cursor: pointer; padding: 17px 20px; display: flex; gap: 14px;
  align-items: center; justify-content: space-between;
  font-family: var(--f-d); font-size: clamp(1.02rem, 1.5vw, 1.2rem);
}
.qa summary::-webkit-details-marker{ display: none; }
.qa summary svg{ width: 17px; height: 17px; color: var(--brand); flex: none; transition: transform .3s var(--e); }
.qa[open] summary svg{ transform: rotate(90deg); }
.qa p{ padding: 0 20px 19px; color: var(--ink-2); font-size: .92rem; max-width: 74ch; }

/* ==================================================================== visit */
.visit{ display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(24px, 4vw, 52px); align-items: start; }
@media (max-width: 860px){ .visit{ grid-template-columns: 1fr; } }
.visit h2{ margin-bottom: 20px; }
.hours{ width: 100%; border-collapse: collapse; }
.hours th, .hours td{ text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 400; font-size: .92rem; }
.hours th{ color: var(--ink-2); }
.hours td{ text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.hours tr.off td{ color: var(--ink-3); font-weight: 400; }
.visit__l{ display: grid; gap: 14px; margin-top: 24px; }
.visit__l a, .visit__l div{ display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; }
.visit__l svg{ width: 17px; height: 17px; color: var(--brand); margin-top: 4px; }
.visit__l span{ display: flex; flex-direction: column; font-size: .8rem; color: var(--ink-3); }
.visit__l b{ font-size: .95rem; color: var(--ink); font-weight: 600; }
.visit__art img{ width: 100%; height: auto; border-radius: var(--r-l); box-shadow: var(--sh); }

/* ==================================================================== wizard */
.wiz{ display: grid; grid-template-columns: 190px 1fr 260px; gap: 20px; align-items: start; }
@media (max-width: 1080px){ .wiz{ grid-template-columns: 1fr; } }

.wiz__rail{ list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; position: sticky; top: 24px; }
.wiz__rail li button{
  width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 13px;
  background: none; border: 0; border-radius: var(--r-s); cursor: pointer; text-align: left;
  color: var(--ink-3); font-size: .85rem; font-weight: 600; transition: all .25s var(--e);
}
.wiz__rail li button:disabled{ cursor: default; }
.wiz__n{
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--line-2); font-size: .78rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.wiz__n svg{ width: 13px; height: 13px; }
.wiz__rail .is-on button{ background: var(--brand-lt); color: var(--brand-d); }
.wiz__rail .is-on .wiz__n{ background: var(--brand); border-color: var(--brand); color: #fff; }
.wiz__rail .is-done button{ color: var(--ink-2); }
.wiz__rail .is-done .wiz__n{ background: var(--brand-d); border-color: var(--brand-d); color: #fff; }
@media (max-width: 1080px){
  .wiz__rail{ position: static; grid-auto-flow: column; grid-auto-columns: 1fr; overflow-x: auto; }
  .wiz__t{ display: none; }
  .wiz__rail li button{ justify-content: center; }
}

.wiz__body{
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: clamp(20px, 3vw, 30px);
}
.wiz__p{ display: grid; gap: 16px; }
.wiz__p h2{ font-size: clamp(1.45rem, 2.4vw, 1.9rem); }
.wiz__sub{ color: var(--ink-2); font-size: .89rem; margin-top: -8px; }
.wiz__b{ display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; padding-top: 6px; }

.pick{ display: grid; gap: 8px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
.pick__i{
  display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; text-align: left;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-s);
  padding: 14px 16px; cursor: pointer; transition: all .25s var(--e);
}
.pick__i:hover{ border-color: var(--brand); background: var(--card); }
.pick__i.is-on{ border-color: var(--brand); background: var(--brand-lt); }
.pick__n{ grid-column: 1; grid-row: 1; font-weight: 700; font-size: .95rem; }
.pick__d{ grid-column: 1; grid-row: 2; color: var(--ink-2); font-size: .82rem; }
.pick__p{ grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; font-family: var(--f-d); font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; }
.pick__p em{ font-family: var(--f-b); font-style: normal; font-size: .68rem; color: var(--ink-3); font-weight: 600; }

.who{ display: grid; gap: 8px; }
.who__i{
  display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 16px;
  transition: all .25s var(--e);
}
.who__i:hover{ border-color: var(--brand); background: var(--card); }
.who__i.is-on{ border-color: var(--brand); background: var(--brand-lt); }
.who__i span{ display: flex; flex-direction: column; }
.who__i b{ font-size: .93rem; font-weight: 700; }
.who__i em{ font-style: normal; font-size: .78rem; color: var(--ink-3); }
.who__av{
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: linear-gradient(140deg, #CFE3D6, #EFE3C7); color: var(--brand-d);
  font-family: var(--f-d); font-size: 1rem; font-weight: 600; border: 1px solid var(--line-2);
}
.who__av--any svg{ width: 18px; height: 18px; color: var(--brand); }

.days{ display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.day{
  flex: none; width: 62px; display: grid; gap: 1px; justify-items: center; cursor: pointer;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 6px;
  transition: all .25s var(--e);
}
.day em{ font-style: normal; font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.day b{ font-family: var(--f-d); font-size: 1.3rem; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day span{ font-size: .62rem; color: var(--ink-3); }
.day:hover:not(.is-off){ border-color: var(--brand); }
.day.is-on{ background: var(--brand); border-color: var(--brand); }
.day.is-on em, .day.is-on b, .day.is-on span{ color: #fff; }
.day.is-off{ opacity: .35; cursor: not-allowed; }

.slots{ display: flex; flex-wrap: wrap; gap: 7px; }
.slot{
  padding: 9px 14px; border-radius: var(--r-p); cursor: pointer;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  font-size: .84rem; font-weight: 600; font-variant-numeric: tabular-nums;
  transition: all .22s var(--e);
}
.slot:hover:not(.is-off){ border-color: var(--brand); }
.slot.is-on{ background: var(--brand); border-color: var(--brand); color: #fff; }
.slot.is-off{ opacity: .32; cursor: not-allowed; text-decoration: line-through; }

.grid2{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
@media (max-width: 620px){ .grid2{ grid-template-columns: 1fr; } }
.f{ display: grid; gap: 6px; }
.f--full{ grid-column: 1 / -1; }
.f label{ font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.f input, .f select, .f textarea{
  width: 100%; padding: 12px 14px; border-radius: var(--r-s);
  border: 1px solid var(--line-2); background: var(--paper); color: var(--ink);
  font-family: var(--f-b); font-size: .93rem;
}
.f textarea{ resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus{ outline: none; border-color: var(--brand); background: var(--card); }
.f input::placeholder, .f textarea::placeholder{ color: var(--ink-3); }

.wiz__sum{
  background: var(--brand-lt); border-radius: var(--r); padding: 22px; position: sticky; top: 24px;
}
.wiz__sum h3{ font-size: 1.15rem; margin-bottom: 12px; }
.wiz__sum dl{ display: grid; gap: 9px; margin: 0; }
.wiz__sum dt{ font-size: .66rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.wiz__sum dd{ margin: 0 0 4px; font-size: .9rem; font-weight: 500; }
.wiz__price{ font-family: var(--f-d); font-size: 1.3rem; font-weight: 500; }
.wiz__price em{ font-family: var(--f-b); font-style: normal; font-size: .72rem; color: var(--ink-3); font-weight: 600; }
.wiz__fine{ font-size: .76rem; color: var(--ink-2); margin-top: 16px; line-height: 1.55; }
@media (max-width: 1080px){ .wiz__sum{ position: static; } }

.done{
  background: var(--card); border: 1px solid var(--brand); border-radius: var(--r);
  padding: clamp(22px, 3vw, 32px); margin-bottom: 20px;
}
.done dl{ display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; margin: 0; }
.done dt{ font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); align-self: center; }
.done dd{ margin: 0; font-size: .95rem; font-weight: 500; }
.done__b{ display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
@media (max-width: 560px){ .done dl{ grid-template-columns: 1fr; gap: 2px 0; } .done dd{ margin-bottom: 10px; } }

/* ==================================================================== footer */
.foot{ border-top: 1px solid var(--line); padding-block: clamp(34px, 4vw, 56px) 28px; margin-top: clamp(24px, 4vw, 48px); }
.foot__g{ display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.3fr; gap: clamp(20px, 3vw, 40px); }
@media (max-width: 860px){ .foot__g{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px){ .foot__g{ grid-template-columns: 1fr; } }
.foot__g > div > p{ color: var(--ink-2); font-size: .86rem; margin-top: 12px; max-width: 34ch; }
.foot h4{
  font-family: var(--f-b); font-size: .68rem; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px;
}
.foot ul{ list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot li{ font-size: .88rem; color: var(--ink-2); }
.foot li a:hover{ color: var(--brand); }
.foot__b{ margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .78rem; color: var(--ink-3); }

/* ==================================================================== boot */
.boot{ display: grid; place-items: center; min-height: 70vh; gap: 10px; text-align: center; }
.boot__m{ font-family: var(--f-d); font-size: 2.6rem; font-weight: 600; letter-spacing: .06em; }
.boot__s{ font-size: .7rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--brand); }
</style>
</head>

<div id="root">
  <div class="boot">
    <span class="boot__m">LUXE</span>
    <span class="boot__s">Hair &amp; Beauty · Colombo 07</span>
  </div>
</div>
